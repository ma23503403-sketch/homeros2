/* room API used by the game: join(code) -> {presence,peers,onPeers,on,emit,leave}.

   Only the player's own rooms/<code>/<uid> node is ever written. */
function makeRoom({db,d,uid}){
 return{join:async code=>{
  const base='rooms/'+code,mine=db.ref(d,base+'/'+uid),evRef=db.ref(d,base+'/'+uid+'/ev'),pRef=db.ref(d,base+'/'+uid+'/p');
  const ls={},pl=new Set(),sent=[];let peers=[],seen=null,unV=null,left=false,od=false,tm=null;
  const safe=f=>{try{f()}catch(e){}};
  const deliver=(type,m)=>(ls[type]||[]).slice().forEach(f=>safe(()=>f(m)));
  const js=s=>{try{return JSON.parse(s)}catch(e){return null}};
  const hand=s=>{const v=s.val()||{};
   const np=Object.keys(v).filter(k=>v[k]&&typeof v[k].p==='string').map(k=>({peer:k,isMe:k===uid,sameTab:false,presence:js(v[k].p)})).filter(x=>x.presence);
   const prev=peers.map(x=>x.peer),cur=np.map(x=>x.peer);
   const lf=prev.filter(x=>!cur.includes(x)),jn=cur.filter(x=>!prev.includes(x));peers=np;
   const first=seen===null;if(first)seen=new Set();
   const present=new Set(),evs=[];
   Object.keys(v).forEach(k=>{const e=v[k]&&v[k].ev;if(!e||typeof e!=='object')return;Object.keys(e).forEach(ek=>{const id=k+'/'+ek;present.add(id);if(seen.has(id))return;seen.add(id);if(!first&&k!==uid&&e[ek])evs.push({k,ek,e:e[ek]})})});
   seen.forEach(id=>{if(!present.has(id))seen.delete(id)});
   if(lf.length||jn.length||true)pl.forEach(f=>safe(()=>f({left:lf,joined:jn})));
   evs.sort((a,b)=>((a.e.t||0)-(b.e.t||0))||(a.ek<b.ek?-1:a.ek>b.ek?1:0)).forEach(x=>deliver(x.e.y,{type:x.e.y,data:js(x.e.d),peer:x.k,isMe:false}))};
  await new Promise((res,rej)=>{let done=0;
   unV=db.onValue(db.ref(d,base),s=>{hand(s);if(!done){done=1;res()}},err=>{if(!done){done=1;rej(err)}});
   setTimeout(()=>{if(!done){done=1;res()}},7000)});
  safe(()=>db.remove(evRef).catch(()=>{}));
  tm=setInterval(()=>{const now=Date.now(),old=sent.filter(x=>now-x[1]>4000);if(!old.length)return;old.forEach(x=>sent.splice(sent.indexOf(x),1));const u={};old.forEach(x=>u[x[0]]=null);db.update(evRef,u).catch(()=>{})},2000);
  return{
   presence:async o=>{if(left)return;if(!od){od=true;try{db.onDisconnect(mine).remove()}catch(e){}}await db.set(pRef,JSON.stringify(o))},
   peers:()=>peers.slice(),

   on:(type,fn)=>{(ls[type]=ls[type]||[]).push(fn);return()=>{const a=ls[type]||[],i=a.indexOf(fn);if(i>=0)a.splice(i,1)}},
   emit:async(type,data)=>{if(left)return;const dj=JSON.stringify(data===undefined?null:data);
    Promise.resolve().then(()=>deliver(type,{type,data:js(dj),peer:uid,isMe:true}));
    const r=db.push(evRef);sent.push([r.key,Date.now()]);await db.set(r,{y:type,d:dj,t:Date.now()})},
   leave:async()=>{if(left)return;left=true;if(unV)safe(unV);clearInterval(tm);pl.clear();Object.keys(ls).forEach(k=>delete ls[k]);try{db.onDisconnect(mine).cancel()}catch(e){}try{await db.remove(mine)}catch(e){}}}}}}
window.__hmMakeRoom=makeRoom;
window.claude={use:async name=>{
 if(name==='permissions')return{request:async()=>{}};
 const c=await boot();
 if(name==='user')return{id:async()=>c.uid};
 if(name==='room')return makeRoom(c);
 return null}};
})();
</script>

 const P=H+300,n=5;
 for(let i=0;i<n;i++)for(let s=0;s<2;s++){const y=((i*(P/n)+(s?P/10:0)+d)%P)-150,id=th.m[(i+s*2)%th.m.length],f=LM[id];if(!f)continue;c.save();c.translate(s?W-30:30,y);c.scale(.95,.95);f(c,t);c.restore()}
}
